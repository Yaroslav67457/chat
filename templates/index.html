<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <title>Python Chat</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: system-ui, 'Segoe UI', sans-serif;
            }
            body {
                background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            .chat-container {
                max-width: 1100px;
                width: 100%;
                height: 85vh;
                background: rgba(22, 32, 42, 0.85);
                backdrop-filter: blur(2px);
                border-radius: 2rem;
                box-shadow: 0 25px 45px rgba(0,0,0,0.3);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .chat-header {
                background: rgba(10, 20, 28, 0.9);
                padding: 1rem 1.8rem;
                border-bottom: 1px solid rgba(72, 187, 255, 0.3);
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: baseline;
                gap: 12px;
            }
            .title {
                color: #b9e6ff;
                font-weight: 700;
                font-size: 1.45rem;
            }
            .title span {
                background: #2c5a7a;
                padding: 4px 12px;
                border-radius: 40px;
                font-size: 0.75rem;
            }
            .user-panel {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
            }
            .nick-input {
                background: #1e2f3c;
                border: 1px solid #3f6b88;
                padding: 8px 14px;
                border-radius: 60px;
                color: #eef5ff;
                outline: none;
                width: 150px;
            }
            .btn-set {
                background: #2c6e9e;
                border: none;
                padding: 6px 16px;
                border-radius: 40px;
                color: white;
                font-weight: 600;
                cursor: pointer;
                transition: 0.2s;
            }
            .btn-set:hover {
                background: #1f8ad0;
            }
            .status-badge {
                font-size: 0.8rem;
                background: #1f3e4e;
                padding: 5px 12px;
                border-radius: 30px;
                color: #aad4f5;
            }
            .notif-toggle {
                background: transparent;
                border: none;
                padding: 6px 8px;
                border-radius: 10px;
                color: white;
                cursor: pointer;
                font-size: 1.25rem;
                transition: 0.2s;
            }
            .notif-toggle:hover {
                background: rgba(255,255,255,0.1);
            }
            .notif-wrapper {
                position: relative;
            }
            .notif-menu {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 10;
                width: min(340px, calc(100vw - 32px));
                padding: 18px;
                background: #172936;
                border: 1px solid #3f627b;
                border-radius: 16px;
                box-shadow: 0 10px 28px rgba(0,0,0,0.35);
                color: #dcecf7;
            }
            .notif-menu[hidden] {
                display: none;
            }
            .notif-menu-title {
                margin-bottom: 14px;
                font-size: 1rem;
                font-weight: 600;
            }
            .notif-all-button {
                width: 100%;
                margin-bottom: 14px;
                padding: 9px 12px;
                border: 1px solid #3f627b;
                border-radius: 9px;
                background: #24475c;
                color: #eaf7ff;
                cursor: pointer;
                text-align: left;
                font-size: 0.85rem;
            }
            .notif-all-button:hover {
                background: #2d607d;
            }
            .notif-add {
                display: flex;
                gap: 6px;
                margin-bottom: 10px;
            }
            .notif-add input {
                min-width: 0;
                flex: 1;
                padding: 7px 9px;
                border: 1px solid #3f627b;
                border-radius: 8px;
                background: #1f2f3a;
                color: white;
                outline: none;
            }
            .notif-add button,
            .notif-user-remove {
                border: none;
                border-radius: 8px;
                background: #2c7cb6;
                color: white;
                cursor: pointer;
            }
            .notif-add button {
                padding: 0 10px;
            }
            .notif-users {
                display: flex;
                flex-direction: column;
                gap: 6px;
                max-height: 180px;
                overflow-y: auto;
            }
            .notif-user {
                display: flex;
                align-items: center;
                gap: 10px;
                min-height: 34px;
                padding: 6px 0;
                font-size: 0.82rem;
                border-bottom: 1px solid rgba(145, 190, 215, 0.2);
            }
            .notif-user:last-child {
                border-bottom: none;
            }
            .notif-user-name {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .notif-user-remove {
                padding: 3px 8px;
                background: #5a4a4a;
            }
            .notif-empty {
                color: #9bb8cf;
                font-size: 0.75rem;
                font-style: italic;
            }
            .messages-area {
                flex: 1;
                overflow-y: auto;
                padding: 20px 22px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .message {
                max-width: 85%;
                width: fit-content;
                animation: fadeSlide 0.2s ease-out;
            }
            .message-own {
                align-self: flex-end;
            }
            .message-other {
                align-self: flex-start;
            }
            .message-bubble {
                padding: 10px 16px;
                border-radius: 24px;
                background: #1e2f3b;
                color: #eef2f5;
                word-wrap: break-word;
                white-space: pre-wrap;
            }
            .message-own .message-bubble {
                background: #1f6390;
                border-bottom-right-radius: 5px;
            }
            .message-other .message-bubble {
                background: #2a3f4c;
                border-bottom-left-radius: 5px;
            }
            .message-meta {
                font-size: 0.7rem;
                margin: 4px 10px 2px 10px;
                display: flex;
                gap: 12px;
                color: #9bb8cf;
            }
            .message-name {
                font-weight: 600;
            }
            .chat-image {
                max-width: 250px;
                max-height: 200px;
                border-radius: 12px;
                margin-top: 6px;
                cursor: pointer;
                border: 1px solid rgba(255,255,255,0.2);
            }
            .system-message {
                text-align: center;
                font-size: 0.75rem;
                background: rgba(0,0,0,0.4);
                padding: 6px 12px;
                border-radius: 50px;
                width: fit-content;
                margin: 5px auto;
                color: #bcd0df;
                font-style: italic;
            }
            .input-panel {
                background: #0d1a24;
                padding: 16px 22px;
                border-top: 1px solid #2f556b;
                display: flex;
                gap: 12px;
                align-items: flex-end;
            }
            .input-wrapper {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .message-input {
                width: 100%;
                background: #1f2f3a;
                border: none;
                padding: 14px 20px;
                border-radius: 24px;
                color: white;
                font-size: 1rem;
                outline: none;
                border: 1px solid #3f627b;
                resize: vertical;
                font-family: inherit;
                white-space: pre-wrap;
            }
            .toolbar {
                display: flex;
                gap: 10px;
                align-items: center;
            }
            .file-label {
                background: #2c6e9e;
                padding: 8px 16px;
                border-radius: 30px;
                color: white;
                font-size: 0.85rem;
                cursor: pointer;
                transition: 0.2s;
            }
            .file-label:hover {
                background: #1f8ad0;
            }
            .send-btn {
                background: #2c7cb6;
                border: none;
                width: 48px;
                height: 48px;
                border-radius: 60px;
                cursor: pointer;
                color: white;
                font-size: 1.4rem;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .chat-link {
                color: #A2E4FA;
                text-decoration: underline;
                cursor: pointer;
            }
            .chat-link:hover {
                color: #9acaff;
            }

            .reply-btn {
                background: transparent;
                border: none;
                color: #7fa5c0;
                cursor: pointer;
                font-size: 0.7rem;
                padding: 0 6px;
                border-radius: 6px;
                transition: 0.15s;
            }
            .reply-btn:hover {
                color: #c3e2ff;
                background: rgba(255,255,255,0.08);
            }
            .reply-quote {
                padding: 4px 10px;
                margin-bottom: 6px;
                border-left: 3px solid #4a8eb0;
                background: rgba(255,255,255,0.06);
                border-radius: 6px;
                font-size: 0.78rem;
                color: #b0d0e5;
            }
            .reply-quote-name {
                font-weight: 600;
                color: #8ecaf0;
            }
            .edit-btn {
                background: transparent;
                border: none;
                color: #7fa5c0;
                cursor: pointer;
                font-size: 0.7rem;
                padding: 0 6px;
                border-radius: 6px;
                transition: 0.15s;
            }
            .edit-btn:hover {
                color: #f0d080;
                background: rgba(255,255,255,0.08);
            }
            .whisper-btn {
                background: transparent;
                border: 1px solid #3f627b;
                width: 48px;
                height: 48px;
                border-radius: 60px;
                cursor: pointer;
                font-size: 1.2rem;
                transition: 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .whisper-msg .message-name::after {
                content: ' 🤫';
                font-size: 0.85em;
            }
            .whisper-msg .message-bubble {
                border-left: 3px solid #4a8eb0;
                color: #f0d080;
                background: rgba(255,255,255,0.08);
            }
            .edit-textarea {
                width: 100%;
                background: #1a2e3c;
                border: 1px solid #4a8eb0;
                border-radius: 10px;
                padding: 8px 12px;
                color: white;
                font-size: 0.9rem;
                font-family: inherit;
                resize: vertical;
                outline: none;
                min-height: 60px;
            }
            .edited-badge {
                font-size: 0.65rem;
                color: #7a9ab0;
                margin-left: 6px;
            }

            /* Telegram-inspired visual layer. Functional classes and API stay unchanged. */
            :root {
                color-scheme: dark;
                --app-height: 100vh;
            }

            @supports (height: 100dvh) {
                :root {
                    --app-height: 100dvh;
                }
            }

            body {
                background:
                    radial-gradient(circle at 15% 10%, rgba(61, 112, 148, 0.22), transparent 34%),
                    linear-gradient(145deg, #0d1f30 0%, #142f46 100%);
                padding: clamp(0px, 2vw, 24px);
                color: #dbeaf3;
            }

            .chat-container {
                max-width: 1180px;
                height: min(92vh, 900px);
                height: min(92dvh, 900px);
                min-height: 560px;
                background: #142b40;
                border: 1px solid rgba(116, 167, 200, 0.2);
                border-radius: 14px;
                box-shadow: 0 18px 50px rgba(3, 12, 21, 0.48);
                flex: 0 1 auto;
            }

            .chat-header {
                min-height: 70px;
                padding: 13px 18px;
                background: #234d6b;
                border-bottom: 1px solid rgba(133, 190, 222, 0.18);
                align-items: center;
                color: #e4f2fa;
            }

            .title {
                display: flex;
                align-items: center;
                gap: 10px;
                color: #e4f2fa;
                font-size: 1.18rem;
                letter-spacing: -0.01em;
            }

            .title::before {
                content: "✦";
                display: grid;
                place-items: center;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: rgba(160, 211, 238, 0.16);
                color: #d9effa;
                font-size: 1rem;
            }

            .title span {
                background: rgba(7, 29, 47, 0.35);
                padding: 4px 9px;
                color: #c8e4f3;
            }

            .user-panel {
                gap: 8px;
            }

            .nick-input {
                width: 150px;
                min-height: 44px;
                padding: 9px 12px;
                background: rgba(8, 31, 49, 0.3);
                border: 1px solid rgba(169, 214, 235, 0.25);
                border-radius: 9px;
                color: #e2f1f8;
            }

            .nick-input::placeholder {
                color: rgba(220, 239, 248, 0.68);
            }

            .nick-input:focus {
                border-color: rgba(184, 225, 243, 0.78);
                box-shadow: 0 0 0 3px rgba(101, 180, 222, 0.16);
            }

            .btn-set {
                min-height: 44px;
                padding: 7px 13px;
                border-radius: 9px;
                background: #2e668a;
                color: #477596;
                font-size: 0.82rem;
                color: #eaf7fd;
                border: 1px solid rgba(169, 214, 235, 0.22);
            }

            .btn-set:hover {
                background: #39789e;
            }

            .status-badge {
                padding: 6px 9px;
                border-radius: 9px;
                background: rgba(8, 31, 49, 0.3);
                color: #d9eef7;
                font-size: 0.75rem;
            }

            .notif-toggle {
                min-width: 44px;
                min-height: 44px;
                border-radius: 9px;
                color: #d9eef7;
            }

            .notif-toggle:hover,
            .notif-toggle:focus-visible {
                background: rgba(169, 214, 235, 0.14);
                outline: none;
            }

            .notif-menu {
                background: #172f45;
                border: 1px solid #365772;
                border-radius: 12px;
                box-shadow: 0 14px 36px rgba(1, 10, 18, 0.42);
                color: #d8e9f2;
            }

            .notif-all-button {
                border-color: #365772;
                background: #203e57;
                color: #d8e9f2;
            }

            .notif-all-button:hover {
                background: #2a506d;
            }

            .notif-add input {
                border-color: #365772;
                background: #12283b;
                color: #d8e9f2;
            }

            .messages-area {
                padding: 18px clamp(12px, 4vw, 42px);
                gap: 6px;
                min-height: 0;
                flex: 1 1 auto;
                background-color: #10283d;
                background-image:
                    radial-gradient(rgba(109, 164, 195, 0.13) 1px, transparent 1px),
                    radial-gradient(rgba(188, 222, 237, 0.06) 1px, transparent 1px);
                background-position: 0 0, 9px 9px;
                background-size: 18px 18px;
                overscroll-behavior: contain;
            }

            .message {
                max-width: min(76%, 700px);
            }

            .message-bubble {
                padding: 8px 12px 7px;
                border-radius: 12px;
                background: #1c3951;
                color: #e2eef4;
                box-shadow: 0 1px 2px rgba(1, 13, 23, 0.32);
            }

            .message-own .message-bubble {
                background: #25516a;
                border-bottom-right-radius: 4px;
            }

            .message-other .message-bubble {
                background: #1c3951;
                border-bottom-left-radius: 4px;
            }

            .message-meta {
                gap: 7px;
                margin: 3px 8px 3px;
                color: #789bad;
                font-size: 0.68rem;
                align-items: center;
            }

            .message-name {
                color: #77b4d5;
                font-weight: 700;
            }

            .message-own .message-meta {
                justify-content: flex-end;
            }

            .message-own .message-name {
                display: inline;
                color: #77b4d5;
            }

            .chat-image {
                max-width: min(320px, 100%);
                max-height: 260px;
                margin-top: 5px;
                border: 1px solid rgba(129, 185, 210, 0.2);
                border-radius: 9px;
            }

            .system-message {
                margin: 6px auto;
                padding: 5px 10px;
                background: rgba(48, 91, 117, 0.86);
                color: #deeff7;
                border-radius: 9px;
                font-size: 0.7rem;
                font-style: normal;
                box-shadow: 0 1px 2px rgba(46, 75, 92, 0.12);
            }

            .input-panel {
                flex: 0 0 auto;
                padding: 10px 14px 12px;
                background: #12283b;
                border-top: 1px solid #294861;
            }

            .input-wrapper {
                flex-direction: row;
                align-items: flex-end;
                gap: 8px;
            }

            .message-input {
                flex: 1 1 auto;
                min-width: 0;
                min-height: 44px;
                max-height: 150px;
                padding: 11px 14px;
                resize: none;
                background: #1a354b;
                border: 1px solid #345771;
                border-radius: 12px;
                color: #e2eef4;
            }

            .message-input:focus {
                border-color: #5b9bc1;
                background: #1d3c54;
                box-shadow: 0 0 0 3px rgba(91, 167, 211, 0.14);
            }

            .message-input::placeholder {
                color: #7899ab;
            }

            .toolbar {
                flex: 0 0 auto;
                gap: 6px;
            }

            .file-label {
                display: grid;
                place-items: center;
                width: 44px;
                height: 44px;
                padding: 0;
                overflow: hidden;
                border-radius: 10px;
                background: transparent;
                color: #80a8bc;
                font-size: 0;
            }

            .file-label::before {
                content: "＋";
                font-size: 1.65rem;
                line-height: 1;
            }

            .file-label:hover {
                background: rgba(114, 177, 211, 0.14);
                color: #a6d6eb;
            }

            .send-btn {
                width: 44px;
                height: 44px;
                border-radius: 10px;
                background: #3390ec;
                font-size: 1.2rem;
                box-shadow: 0 2px 6px rgba(51, 144, 236, 0.25);
                transition: background 0.16s ease, transform 0.16s ease;
            }

            .send-btn:hover {
                background: #2485e4;
                transform: translateY(-1px);
            }

            .chat-link {
                color: #2f86c5;
            }

            .reply-btn,
            .edit-btn {
                color: #82acc0;
            }

            .reply-btn:hover,
            .edit-btn:hover {
                color: #9bd3eb;
                background: rgba(114, 177, 211, 0.14);
            }

            .reply-quote {
                margin-bottom: 5px;
                padding: 4px 8px;
                border-left-color: #56a3d2;
                background: rgba(113, 171, 199, 0.13);
                color: #aac6d4;
            }

            .reply-quote-name {
                color: #77c1df;
            }

            .whisper-msg .message-bubble {
                border-left-color: #e2aa55;
                background: #3f3e32;
                color: #f0dfaa;
            }

            .edit-textarea {
                background: #173148;
                border-color: #6ea3c3;
                color: #e2eef4;
            }

            @media (max-width: 900px) {
                body {
                    padding: 0;
                    align-items: stretch;
                    width: 100%;
                    height: 100vh;
                    height: var(--app-height, 100dvh);
                    min-height: 100vh;
                    min-height: var(--app-height, 100dvh);
                    overflow: hidden;
                }

                .chat-container {
                    width: 100%;
                    max-width: none;
                    height: 100%;
                    min-height: 0;
                    border: 0;
                    border-radius: 0;
                }

                .chat-header {
                    flex: 0 0 auto;
                    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
                }

                .title {
                    font-size: 1rem;
                }

                .title::before {
                    width: 30px;
                    height: 30px;
                }

                .user-panel {
                    width: 100%;
                }

                .nick-input {
                    flex: 1;
                    min-width: 0;
                }

                .status-badge {
                    max-width: 128px;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                }

                .messages-area {
                    min-height: 0;
                    padding: 14px 10px;
                }

                .message {
                    max-width: 88%;
                }

                .input-panel {
                    padding: 8px 9px calc(10px + env(safe-area-inset-bottom));
                }

                .message-input {
                    min-width: 0;
                }
            }

            @media (max-width: 520px) {
                .chat-header {
                    gap: 8px;
                }

                .user-panel {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) auto;
                    gap: 6px;
                    align-items: center;
                }

                .nick-input {
                    width: auto;
                    min-width: 0;
                }

                .status-badge {
                    max-width: none;
                    grid-column: 1;
                    justify-self: start;
                }

                .notif-wrapper {
                    grid-column: 2;
                    grid-row: 2;
                    justify-self: end;
                }

                .input-panel {
                    gap: 6px;
                }

                .input-wrapper {
                    gap: 6px;
                }
            }

            @media (max-height: 600px) and (orientation: landscape) {
                .chat-header {
                    padding-top: calc(6px + env(safe-area-inset-top));
                    padding-bottom: 6px;
                }

                .title::before {
                    width: 28px;
                    height: 28px;
                }

                .messages-area {
                    padding-top: 8px;
                    padding-bottom: 8px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
            }

            @keyframes fadeSlide {
                from { opacity: 0; transform: translateY(12px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>
    <body>
        <div class="chat-container">
            <div class="chat-header">
                <div class="title">Чат на Python!</div>
                <div class="user-panel">
                    <input
                        type="text"
                        id="nickname"
                        class="nick-input"
                        placeholder="Ваш ник"
                    />
                    <button id="setNickBtn" class="btn-set">
                        ✅ Установить
                    </button>
                    <div class="status-badge" id="status">🔄 Соединение...</div>
                    <div class="notif-wrapper">
                        <button
                            id="notifToggle"
                            class="notif-toggle"
                            type="button"
                            aria-label="Настройки уведомлений"
                            title="Настройки уведомлений"
                        >
                            🔔
                        </button>
                        <div id="notifMenu" class="notif-menu" hidden>
                            <div class="notif-menu-title">
                                Настройки уведомлений
                            </div>
                            <button
                                id="notifAllToggle"
                                class="notif-all-button"
                                type="button"
                            ></button>
                            <div class="notif-add">
                                <input
                                    id="notifNickInput"
                                    type="text"
                                    placeholder="Ник пользователя"
                                />
                                <button id="notifAddBtn" type="button">
                                    +
                                </button>
                            </div>
                            <div id="notifUsers" class="notif-users"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="messages-area" id="messages"></div>
            <div class="input-panel">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        class="message-input"
                        rows="1"
                        placeholder="Сообщение..."
                    ></textarea>
                    <div class="toolbar">
                        <label class="file-label">
                            📷 Отправить скриншот
                            <input
                                type="file"
                                id="imageInput"
                                accept="image/*"
                                style="display: none"
                            />
                        </label>
                        <button id="sendBtn" class="send-btn">➤</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="/static/js/app.js"></script>

        <script src="/static/js/messages.js"></script>
        <script src="/static/js/compose.js"></script>
        <script src="/static/js/whispers.js"></script>

        <script src="/static/js/ui.js"></script>
